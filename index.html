<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱你</title>
  <style>

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05060f;
    }

    #sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(120% 85% at 78% 8%, rgba(120,150,255,.28) 0%, rgba(0,0,0,0) 55%),
        radial-gradient(90% 60% at 18% 96%, rgba(255,130,190,.30) 0%, rgba(0,0,0,0) 60%),
        linear-gradient(180deg,
          #05060f 0%,
          #0b1436 30%,
          #1d2a63 55%,
          #4a3572 74%,
          #8a4a76 88%,
          #d4718c 100%);
    }
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* ---- 开场遮罩 ---- */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(4, 5, 14, 0.72);
      transition: opacity 1.8s;
    }
    #gate.hide {
      opacity: 0;
      pointer-events: none;
    }
    #gate .tip {
      font-size: 18px;
      letter-spacing: 0.3em;
      color: #ffd7e6;
      animation: breath 2.4s ease-in-out infinite;
    }
    #gate .tip small {
      display: block;
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5);
      animation: none;
    }
    @keyframes breath {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    /* ---- 音量控件 ---- */
    #vol {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(10, 12, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0.3;                      /* 平时很淡，不抢画面 */
      transition: opacity .45s;
      user-select: none;
    }
    #vol.show { opacity: 1; }
    #vol:hover { opacity: 1; }

    #vol button {
      width: 30px; height: 30px;
      border: none; border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #ffe9f2; font-size: 15px; line-height: 1;
      cursor: pointer; padding: 0;
      transition: background .2s, transform .15s;
      font-family: inherit;
    }
    #vol button:hover  { background: rgba(255, 255, 255, 0.22); }
    #vol button:active { transform: scale(0.9); }

    #volMeter {
      position: relative;
      width: 78px; height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.14);
      overflow: visible;
    }
    #volBar {
      height: 100%; width: 45%;
      border-radius: 3px;
      background: linear-gradient(90deg, #ff9dc4, #ffd9e8);
      transition: width .12s linear;
    }
    #volNum {
      position: absolute;
      right: 0; top: -17px;
      font-size: 11px; color: rgba(255, 233, 242, 0.75);
      font-family: inherit;
    }
    #volHint {
      font-size: 11px;
      color: rgba(255, 233, 242, 0.5);
      white-space: nowrap;
      cursor: pointer;
    }

    @media (max-width: 560px) {
      #vol { gap: 6px; padding: 7px 9px; }
      #vol button { width: 27px; height: 27px; font-size: 14px; }
      #volMeter { width: 56px; }
      #volHint { display: none; }        /* 手机上藏掉文字提示，省地方 */
    }
  </style>    
</head>
<body>
  <div id="sky"></div>
  <canvas id="fx"></canvas> 
  <audio id="bgm" loop preload="auto" src="music.mp3"></audio>

  <div id="gate">
    <div class="tip">轻 触 屏 幕<small>建议戴上耳机</small></div>
  </div>

  <!-- 音量控件：右下角，平时淡淡的，碰一下或按键才亮起来 -->
  <div id="vol">
    <button data-step="-0.05" title="音量 -">−</button>
    <button data-step="0" title="静音 / 恢复"><span id="volIcon">🔊</span></button>
    <button data-step="0.05" title="音量 +">＋</button>
    <div id="volMeter">
      <div id="volBar"></div>
      <span id="volNum">45%</span>
    </div>
    <div id="volHint">↑ ↓ 键调节</div>
  </div>
  <script>
    const canvas = document.querySelector('#fx');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;
    let cometTimer = 1.5;
    let heartScale = 0.30;

    // ---- 是不是手机 / 触屏设备 ----
    //   想强制指定：在网址后面加 ?mobile=1 或 ?mobile=0
    //   例如：index.html?mobile=1
    const FORCE_MOBILE = /[?&]mobile=([01])/.exec(location.search);
    const IS_MOBILE = FORCE_MOBILE ? FORCE_MOBILE[1] === '1' : (
      /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent) ||
      (('ontouchstart' in window) && Math.min(screen.width, screen.height) < 820)
    );

    // 手机性能弱：粒子少一点、每个点小一点，但看上去要差不多满
    const DENSITY = IS_MOBILE ? 0.52 : 1;
    const DOT_R   = IS_MOBILE ? 1.35 : 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      // 手机高刷屏上限制一下像素密度，避免"2 倍分辨率 × 2000 个粒子"拖垮 GPU
      const dpr = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize();
    window.addEventListener('resize', () => {
      resize();
      buildTextPoints();          // 手机转屏后重新采样，文字位置才不会错
    });
    window.addEventListener('orientationchange', () => setTimeout(() => {
      resize();
      buildTextPoints();
    }, 300));

    const MINW = Math.min(W, H);      // 屏幕短边，用来做各种尺寸基准

    const stars = [];
    const starCount = Math.round(W * H / 3600);

    for (let i = 0; i < starCount; i++) {
      const z = Math.random();
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: z,
        r: 0.4 + z * 1.4,
        base: 0.25 + z * 0.7,
        speed: 0.6 + Math.random() * 1.6,
        drift: (Math.random() - 0.5) * 1.6 * z,
        rise: (0.15 + z * 1.1),
        warm: Math.random() < 0.3
      });
    }
        // 缓动函数：开头快、结尾慢，看起来更自然
    function easeOut(t) {
      const u = 1 - t;
      return 1 - u * u * u;
    }

    let gateOpenAt = 0;     // 点下"轻触屏幕"的时刻，0 = 还没开始

    function drawHeart(now) {
      // 汇聚总进度（0 = 全都在远处，1 = 全部就位）
      const elapsed = gateOpenAt ? (now - gateOpenAt) / 1000 : 0;

      ctx.globalCompositeOperation = 'lighter';

      for (const p of heartPoints) {
        // 这一个点自己的进度
        let k = (elapsed - p.d) / p.dur;
        k = k < 0 ? 0 : (k > 1 ? 1 : k);
        const e = easeOut(k);

        // 飞过来的过程中轻微旋转 —— 像被心吸过去
        const spin = (1 - e) * 0.5;
        const px = p.sx + (p.x - p.sx) * e;
        const py = p.sy + (p.y - p.sy) * e;
        const dx = px - CX;
        const dy = py - CY;
        const cs = Math.cos(spin);
        const sn = Math.sin(spin);
        const fx = CX + dx * cs - dy * sn;
        const fy = CY + dx * sn + dy * cs;

        const tw = 0.65 + 0.35 * Math.sin(now / 700 + p.phase);

        // 外层：淡淡的光晕
        ctx.globalAlpha = 0.10 * tw * e;
        ctx.fillStyle = '#ff7fb0';
        ctx.beginPath();
        ctx.arc(fx, fy, p.size * 4, 0, Math.PI * 2);
        ctx.fill();

        // 内层：亮点
        ctx.globalAlpha = 0.95 * tw * e;
        ctx.fillStyle = '#ffd9e8';
        ctx.beginPath();
        ctx.arc(fx, fy, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function drawText(now) {
      if (!textPoints.length) return;

      const elapsed = gateOpenAt ? (now - gateOpenAt) / 1000 : 0;
      ctx.globalCompositeOperation = 'lighter';

      for (const p of textPoints) {
        let k = (elapsed - p.d) / p.dur;
        k = k < 0 ? 0 : (k > 1 ? 1 : k);
        const e = easeOut(k);
        if (e <= 0) continue;

        // 起点在爱心上，终点在文字里
        const px = p.sx + (p.x - p.sx) * e;
        const py = p.sy + (p.y - p.sy) * e;

        // 落定后极轻微的漂浮，像漂在水面上
        const driftX = Math.sin(now / 1700 + p.phase) * 1.4 * e;
        const driftY = Math.cos(now / 1400 + p.phase) * 1.9 * e;

        const tw = 0.72 + 0.28 * Math.sin(now / 900 + p.phase);

        // 外层柔光（半径也跟着字号走，不然字会糊成一团）
        ctx.globalAlpha = 0.08 * tw * e;
        ctx.fillStyle = '#ff8fba';
        ctx.beginPath();
        ctx.arc(px + driftX, py + driftY, p.size * 2.4, 0, Math.PI * 2);
        ctx.fill();

        // 字的"笔画"
        ctx.globalAlpha = 0.92 * tw * e;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px + driftX, py + driftY, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function draw(now) {
      ctx.clearRect(0, 0, W, H);

      // ---- 星星 ----
      for (const s of stars) {
        s.x += s.drift;
        s.y -= s.rise * 0.5;

        if (s.x < -2) s.x = W + 2;
        if (s.x > W + 2) s.x = -2;
        if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }

        const tw = 0.6 + 0.4 * Math.sin(now / 1000 * s.speed + s.x * 0.05);
        ctx.globalAlpha = s.base * tw;
        ctx.fillStyle = s.warm ? '#ffe2c4' : '#d8e8ff';

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---- 彗星 ----
      cometTimer -= 0.016;
      if (cometTimer <= 0) {
        spawnComet();
        cometTimer = 6 + Math.random() * 7;
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'lighter';

      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];

        c.x += c.vx * 0.016;
        c.y += c.vy * 0.016;
        c.life -= 0.25 * 0.016;

        if (c.life <= 0 || c.y > H + c.len || c.x < -c.len) {
          comets.splice(i, 1);
          continue;
        }

        const vlen = Math.hypot(c.vx, c.vy);
        const tx = c.x - (c.vx / vlen) * c.len;
        const ty = c.y - (c.vy / vlen) * c.len;

        const g = ctx.createLinearGradient(c.x, c.y, tx, ty);
        g.addColorStop(0,    'rgba(255,255,255,' + c.life + ')');
        g.addColorStop(0.15, 'rgba(200,228,255,' + (c.life * 0.7) + ')');
        g.addColorStop(1,    'rgba(160,190,255,0)');

        ctx.strokeStyle = g;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        const hg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 18);
        hg.addColorStop(0, 'rgba(255,255,255,' + c.life + ')');
        hg.addColorStop(1, 'rgba(180,210,255,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      drawHeart(now);
      drawText(now);
      drawInteract();          // 指尖星光 + 点出来的小爱心

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    /* =====================================================================
       互动一：指尖星光 —— 手指/鼠标划过的地方留下渐隐的星光
       互动二：点一下飞心 —— 点哪就在哪生出一颗小爱心，摇摇晃晃飘上去
       ===================================================================== */
    const trail = [];        // 星光粒子
    const flyHearts = [];    // 飞起来的小爱心
    const TRAIL_MAX = 420;
    const HEART_MAX = 42;

    // 画一颗实心小心（用和主爱心同一条参数方程，所以形状一致）
    function drawMiniHeart(x, y, r, alpha, rot) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      const sc = r / 16;
      for (let i = 0; i <= 26; i++) {
        const t = (i / 26) * Math.PI * 2;
        const px = 16 * Math.pow(Math.sin(t), 3) * sc;
        const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * sc;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.globalAlpha = alpha * 0.35;
      ctx.fillStyle = '#ff6fae';
      ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffd9e8';
      ctx.fill();
      ctx.restore();
    }

    function drawInteract() {
      ctx.globalCompositeOperation = 'lighter';

      // ---- 指尖星光 ----
      for (let i = trail.length - 1; i >= 0; i--) {
        const p = trail[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.02;                    // 轻轻往上飘
        p.life -= 0.013;                 // 慢慢淡出（约 1~1.9 秒）
        if (p.life <= 0) { trail.splice(i, 1); continue; }

        const k = p.life / p.life0;      // 剩余比例 0~1
        const a = k * k;                 // 平方：淡出更自然
        ctx.globalAlpha = a * 0.16;
        ctx.fillStyle = '#9fd8ff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---- 点出来的小爱心 ----
      for (let i = flyHearts.length - 1; i >= 0; i--) {
        const h = flyHearts[i];
        h.x += h.vx;
        h.y += h.vy;
        h.vy *= 0.995;                                    // 上升变慢
        h.vx += Math.sin(h.y * 0.03 + h.seed) * 0.05;     // 左右摇晃
        h.rot += h.spin;
        h.age += 1 / 60;
        if (h.age > h.dur || h.y < -60) { flyHearts.splice(i, 1); continue; }

        const k = h.age / h.dur;
        const a = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;   // 先亮起再淡出
        const r = h.r * (0.6 + 0.4 * Math.min(1, k / 0.3)) * (1 - 0.25 * k);
        drawMiniHeart(h.x, h.y, r, a, h.rot);
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function addTrail(x, y) {
      for (let k = 0; k < 3; k++) {
        if (trail.length >= TRAIL_MAX) trail.shift();
        const life = 1.0 + Math.random() * 0.9;      // 留痕约 1~1.9 秒
        trail.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 8,
          vx: (Math.random() - 0.5) * 0.9,
          vy: (Math.random() - 0.5) * 0.9 - 0.15,
          r: 0.7 + Math.random() * 1.9,
          life: life,
          life0: life
        });
      }
    }

    function addFlyHeart(x, y) {
      if (flyHearts.length >= HEART_MAX) flyHearts.shift();
      flyHearts.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 0.7,
        vy: -0.5 - Math.random() * 0.7,          // 往上飘
        r: Math.min(W, H) * 0.022 * (0.8 + Math.random() * 0.6),
        rot: (Math.random() - 0.5) * 0.5,
        spin: (Math.random() - 0.5) * 0.012,
        age: 0,
        dur: 2.4 + Math.random() * 1.6,
        seed: Math.random() * Math.PI * 2
      });
    }

    // ---- 触摸 / 鼠标事件 ----
    let lastPt = null;

    function onMove(x, y) {
      if (lastPt) {
        // 手指划得快时事件之间有间隙，补几个中间点，光带才连续
        const dx = x - lastPt.x;
        const dy = y - lastPt.y;
        const dist = Math.hypot(dx, dy);
        const steps = Math.min(6, Math.max(1, Math.round(dist / 7)));
        for (let i = 1; i <= steps; i++) {
          addTrail(lastPt.x + (dx * i) / steps, lastPt.y + (dy * i) / steps);
        }
      } else {
        addTrail(x, y);
      }
      lastPt = { x, y };
    }

    function onDown(x, y) {
      lastPt = { x, y };
      addTrail(x, y);
      addFlyHeart(x, y);
    }

    function onUp() { lastPt = null; }

    const fxCanvas = document.querySelector('#fx');
    fxCanvas.style.touchAction = 'none';        // 手机上滑动不触发页面滚动

    if (window.PointerEvent) {
      fxCanvas.addEventListener('pointerdown', e => onDown(e.clientX, e.clientY));
      fxCanvas.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    } else {
      // 老浏览器退回鼠标 / 触摸事件
      fxCanvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
      fxCanvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onUp);
      fxCanvas.addEventListener('touchstart', e => {
        const t = e.touches[0]; onDown(t.clientX, t.clientY);
      }, { passive: true });
      fxCanvas.addEventListener('touchmove', e => {
        const t = e.touches[0]; onMove(t.clientX, t.clientY);
      }, { passive: true });
      window.addEventListener('touchend', onUp);
      window.addEventListener('touchcancel', onUp);
    }

    const comets = [];

    function spawnComet() {
      const ang = Math.PI * (1.05 + Math.random() * 0.20);
      const sp  = (0.5 + Math.random() * 0.5) * Math.min(W, H);

      comets.push({
        x: W * (0.3 + Math.random() * 0.8),
        y: -H * 0.15 + Math.random() * H * 0.5,
        vx: Math.cos(ang) * sp,
        vy: -Math.sin(ang) * sp,
        len: (0.25 + Math.random() * 0.3) * Math.min(W, H),
        life: 1
      });
    }
        function heartPoint(t) {
      return {
        x:  16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
      };
    }

    const a = heartScale * Math.min(W, H) / 16;
    const CX = W / 2;
    const CY = H * 0.5;

    function heartDot(t) {
      const p = heartPoint(t);
      return { x: CX + p.x * a, y: CY + p.y * a - 2.54 * a };
    }

    const heartPoints = [];
    const HEART_N = Math.round(1000 * (IS_MOBILE ? 0.52 : 1));
    for (let i = 0; i < HEART_N; i++) {
      const t = (i / HEART_N) * Math.PI * 2;
      const p = heartDot(t);

      // 起点：从爱心中心往外的方向上，退到屏幕之外
      const dx = p.x - CX;
      const dy = p.y - CY;
      const dist = Math.hypot(dx, dy) || 1;       // 已经乘过 a 了，单位是像素
      const dirx = dx / dist;
      const diry = dy / dist;
      const spread = 2.5 + Math.random() * 2.5;   // 退到 2.5~5 倍距离之外（屏幕外）

      heartPoints.push({
        x:  p.x + (Math.random() - 0.5) * 3,
        y:  p.y + (Math.random() - 0.5) * 3,
        sx: CX + dirx * dist * spread,
        sy: CY + diry * dist * spread,
        d:  Math.random() * 1.5,                  // 延迟：错开出发时间
        dur: 2.0 + Math.random() * 1.5,           // 单点飞行时长
        size: (0.8 + Math.random() * 1.4) * DOT_R,
        phase: Math.random() * Math.PI * 2
      });
    }   

    /* =====================================================================
       文字：把「爱你恬恬 / 1314520」采样成一堆点，
       等爱心聚齐后，从爱心上飞出去，长成文字
       ===================================================================== */
    const TXT_MAIN = '爱你恬恬';
    // 只用「每台设备都自带」的字体，不内嵌、不依赖外部文件
    const TXT_FONT = '"PingFang SC", "Microsoft YaHei", "Heiti SC", "Noto Sans CJK SC", sans-serif';

    const textPoints = [];

    function buildTextPoints() {
      if (typeof heartPoints === 'undefined' || !heartPoints.length) return;
      textPoints.length = 0;

      // 爱心在屏幕上的真实尺寸（和心形公式对得上）
      const heartW = 32 * a;
      const heartH = 28.92 * a;

      // 缩小 2 倍采样：格子 2x2 像素，笔画一行能有 4 个点 —— 既不糊也不成虚线
      const S = 2;
      const canvasW = Math.ceil(W / S);
      const canvasH = Math.ceil(H / S);

      const c2 = document.createElement('canvas');
      c2.width = canvasW;
      c2.height = canvasH;
      const g = c2.getContext('2d');
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = '#fff';                     // 只看"有没有画到"，颜色无所谓

      // 只有一行字 —— 放在爱心最宽的位置，可以放大很多
      const mainFs = heartW * 0.74 / TXT_MAIN.length;
      const mainY  = CY - heartH * 0.05;

      // ⚠️ 关键：这些坐标是"整屏像素"，但画布被缩小了 S 倍，所以要除以 S
      g.font = (mainFs / S) + 'px ' + TXT_FONT;
      g.fillText(TXT_MAIN, W / 2 / S, mainY / S);

      const data = g.getImageData(0, 0, canvasW, canvasH).data;

      // 逐行扫描每个字的位置，算出横向渐变（左暖白 → 右粉）
      const rowLeft = {}, rowRight = {};
      for (let py = 0; py < canvasH; py++) {
        for (let px = 0; px < canvasW; px++) {
          if (data[(py * canvasW + px) * 4 + 3] > 128) {
            if (rowLeft[py] === undefined || px < rowLeft[py]) rowLeft[py] = px;
            if (rowRight[py] === undefined || px > rowRight[py]) rowRight[py] = px;
          }
        }
      }

      // 采样：画布缩小了 4 倍，所以这里每 1 个采样像素取 1 个点，
      //       换算回全屏就是每 4x4=16 个像素一个点，笔画刚好填满、不虚
      const step = 1;
      for (let py = 0; py < canvasH; py += step) {
        for (let px = 0; px < canvasW; px += step) {
          if (data[(py * canvasW + px) * 4 + 3] <= 128) continue;

          const tx = px * S;
          const ty = py * S;

          // 从最近的心形点上飞出来 —— 这就是"从爱心里长出来"
          let best = null;
          let bd = Infinity;
          for (const q of heartPoints) {
            const dd = (q.x - tx) * (q.x - tx) + (q.y - ty) * (q.y - ty);
            if (dd < bd) { bd = dd; best = q; }
          }

          // 横向渐变：左边暖白，右边粉
          const L = rowLeft[py] ?? 0;
          const R = rowRight[py] ?? canvasW;
          const gk = R > L ? (px - L) / (R - L) : 0.5;
          const cr = 255;
          const cg = Math.round(250 - 100 * gk);
          const cb = Math.round(244 - 60 * gk);

          textPoints.push({
            x: tx + (Math.random() - 0.5) * 3.5 / S,
            y: ty + (Math.random() - 0.5) * 3.5 / S,
            sx: best ? best.x : CX,               // 起点：心形上的某一点
            sy: best ? best.y : CY,
            // 谁离得近谁先飞，于是文字像"一笔一笔"写出来
            // 最近的点约 3.1s 出发，最远的约 5.0s，全部写完约 6.5s
            d: 3.1 + bd / 60000 + Math.random() * 0.5,
            dur: 1.1 + Math.random() * 0.7,
            size: Math.max(0.55, mainFs * 0.030) * DOT_R,
            phase: Math.random() * Math.PI * 2,
            color: 'rgb(' + cr + ',' + cg + ',' + cb + ')'
          });
        }
      }
    }

    /* =====================================================================
       启动：直接用系统自带字体，不需要等任何外部资源，可以立刻采样
       ===================================================================== */
    buildTextPoints();

    const bgm = document.querySelector('#bgm');
    bgm.volume = 0.45;

    let started = false;
    function start() {
      if (started) return;
      started = true;

      gateOpenAt = performance.now();                    // 开始汇聚
      const gate = document.querySelector('#gate');
      gate.classList.add('hide');

      // 手机上必须"在用户手势里"直接调用 play()，晚一步就会被拦截
      const p = bgm.play();
      if (p && p.catch) p.catch(err => console.log('音乐没播起来:', err));
    }

    const gateEl = document.querySelector('#gate');
    gateEl.addEventListener('click', start);
    gateEl.addEventListener('touchend', start, { passive: true });
    window.addEventListener('keydown', start, { once: true });

    /* =====================================================================
       音量控制
       键盘：↑ / → 调大      ↓ / ← 调小      M 静音切换
       鼠标 / 手指：右下角控件
       ===================================================================== */
    const volBox = document.querySelector('#vol');
    const volBtns = volBox.querySelectorAll('button');
    let lastVol = 0.45;
    let volHideTimer = 0;

    function showVolume() {
      volBox.classList.add('show');
      clearTimeout(volHideTimer);
      volHideTimer = setTimeout(() => volBox.classList.remove('show'), 1600);
    }

    function setVolume(v, show) {
      bgm.volume = Math.min(1, Math.max(0, v));
      const pct = Math.round(bgm.volume * 100);
      document.querySelector('#volBar').style.width = pct + '%';
      document.querySelector('#volNum').textContent = pct + '%';
      document.querySelector('#volIcon').textContent = bgm.volume === 0 ? '🔇' : '🔊';
      if (bgm.volume > 0) lastVol = bgm.volume;
      if (show !== false) showVolume();
    }

    volBtns.forEach(btn => {
      const step = parseFloat(btn.dataset.step);
      if (step === 0) return;
      const act = e => { e.stopPropagation(); setVolume(bgm.volume + step); };
      btn.addEventListener('click', act);
      btn.addEventListener('touchstart', act, { passive: true });
    });

    const muteBtn = volBox.querySelector('[data-step="0"]');
    muteBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (bgm.volume > 0) { lastVol = bgm.volume; setVolume(0); }
      else setVolume(lastVol || 0.45);
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
        setVolume(bgm.volume + 0.05); e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
        setVolume(bgm.volume - 0.05); e.preventDefault();
      } else if (e.key === 'm' || e.key === 'M') {
        if (bgm.volume > 0) { lastVol = bgm.volume; setVolume(0); }
        else setVolume(lastVol || 0.45);
      }
    });

    // 鼠标移过控件就显示，离开一会儿后淡掉
    volBox.addEventListener('mouseenter', showVolume);
    volBox.addEventListener('touchstart', e => { e.stopPropagation(); showVolume(); }, { passive: true });

    setVolume(0.45, false);
    document.querySelector('#volHint').addEventListener('click', showVolume);
  </script>   
</body>
</html>
